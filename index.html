<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argos</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1012" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1EA; --surface:#FBFAF6; --surface-2:#ECE9E0;
  --ink:#15171A; --ink-2:#555A61; --ink-3:#8A8E95; --rule:#D9D5C9;
  --danger:#A3261C; --danger-bg:#F6E3DF; --ok:#1F6B3A; --warn:#8A5A00; --warn-bg:#F7ECCB;
  --accent:#F5D24C; --accent-ink:#15171A; --series:#2F6FB3;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1012; --surface:#17191C; --surface-2:#1F2226;
    --ink:#ECEAE3; --ink-2:#A7AAAF; --ink-3:#6C7076; --rule:#2B2E33;
    --danger:#F08A7E; --danger-bg:#2E1815; --ok:#7BC795; --warn:#E8C26A; --warn-bg:#2E2610; --series:#6FA8E0;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--display);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:8px;padding:14px 0 10px}
.brand{font-weight:800;font-stretch:75%;font-size:20px;text-transform:uppercase;margin-right:auto}
.brand b{display:inline-block;width:10px;height:10px;background:var(--accent);border:1.5px solid var(--ink);border-radius:50%;margin-right:7px}
.nav{display:flex;gap:6px;margin:0 0 14px}
.nav a,.nav button{border:1px solid var(--rule);background:var(--surface);color:var(--ink);text-decoration:none;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.nav [aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px}
.tile .k{font-size:12px;color:var(--ink-2)}
.tile .v{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .u{font-size:12px;color:var(--ink-3);margin-left:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.msg{font-size:14px;min-height:1.2em;color:var(--ink-2)} .msg.bad{color:var(--danger)} .msg.good{color:var(--ok)}
.field{display:block;margin:0 0 12px} .field>span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 12px}
.field small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;margin:0 0 12px}
dialog{border:1px solid var(--rule);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:18px}
.sheet h3{margin:0 0 12px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.list li:first-child{border-top:0}
.list .main{flex:1;min-width:0} .list .sub{font-size:13px;color:var(--ink-2)}
.list button{border:0;background:none;color:var(--ink-3);padding:6px;border-radius:8px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--ink-2)}
.pill.overdue{background:var(--danger-bg);color:var(--danger)} .pill.soon{background:var(--warn-bg);color:var(--warn)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--ink-3)}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .bar{fill:var(--series)} .chart .bar:hover,.chart .bar:focus{opacity:.75;outline:none}
.chart .line{fill:none;stroke:var(--series);stroke-width:2}
.chart .dot{fill:var(--series);stroke:var(--surface);stroke-width:2}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;z-index:9;white-space:nowrap}
.empty{color:var(--ink-3);font-size:14px;padding:4px 0}
.priv{font-size:12px;color:var(--ink-3);margin-top:18px}
[hidden]{display:none!important}
.month{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.month .label{flex:1;text-align:center;font-weight:700}
.hbar{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;margin:0 0 8px;font-size:14px}
.hbar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hbar .track{height:14px;border-radius:0 4px 4px 0;background:transparent}
.hbar .fill{height:14px;border-radius:0 4px 4px 0;background:var(--series);min-width:2px}
.hbar .val{font-family:var(--mono);font-size:13px;white-space:nowrap}
.chart .bar.sel{fill:var(--ink)}
.chart .bar{cursor:pointer}
.up{color:var(--danger)} .down{color:var(--ok)}
.tag{font-size:12px;color:var(--ink-3)}
.nb{font-family:var(--mono);font-weight:700;font-size:20px;min-width:64px;text-align:right}
.nb small{font-size:12px;font-weight:400;color:var(--ink-3)}
</style>
<style>
.mod{display:block;text-decoration:none;color:inherit}
.mod h2{margin:0 0 4px;font-size:16px}
.mod p{margin:0;color:var(--ink-2);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><b></b>Argos</div></div>
  <nav class="nav" aria-label="Seções"><a href="index.html" aria-current="page">Início</a><a href="onibus.html">Ônibus</a><a href="carro.html">Carro</a><a href="gastos.html">Gastos</a></nav>

  <div id="bus"></div>
  <div id="summary" hidden>
    <div class="tiles" id="tiles"></div>
    <div id="remind"></div>
  </div>
  <p id="note" class="priv" style="margin:0 0 12px"></p>

  <a class="card mod" href="onibus.html"><h2>Ônibus</h2><p>Próximas chegadas STCP e horários UNIR.</p></a>
  <a class="card mod" href="carro.html"><h2>Carro</h2><p>Quilometragem, abastecimento, consumo e revisões.</p></a>
  <a class="card mod" href="gastos.html"><h2>Gastos</h2><p>Gráfico mensal e por categoria.</p></a>
</div>
<script type="module">
import { createVault } from './lib/vault.js';
import { homeSummary } from './lib/home-core.js';
import { nextBuses } from './lib/home-bus.js';
import { createUnir, fetchJSON, stcpBase } from './lib/bus-net.js';

const $ = (s) => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => (n ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'EUR' });
const km = n => Math.round(n).toLocaleString('pt-BR');
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const vault = createVault();

async function main() {
  if (!vault.configured()) { $('#note').innerHTML = 'Para ver o resumo, conecte o cofre em <a href="carro.html">Carro → Cofre</a>.'; return; }
  try {
    const [e, f, s] = await Promise.all([vault.list('expenses'), vault.list('car-fuel'), vault.list('car-service')]);
    const t = today(), r = homeSummary({ expenses: e.items, fuels: f.items, services: s.items }, t);
    const d = r.delta;
    $('#tiles').innerHTML =
      `<div class="tile"><div class="k">Gasto em ${MONTHS[+r.month.slice(5) - 1]}</div><div><span class="v">${eur(r.total)}</span></div></div>` +
      `<div class="tile"><div class="k">Contra o mês anterior</div><div><span class="v">${d == null ? '–' : (d > 0 ? '▲ ' : d < 0 ? '▼ ' : '') + Math.abs(Math.round(d)) + '%'}</span></div></div>`;
    $('#remind').innerHTML = r.reminders.length ? `<div class="card"><h2>Lembretes do carro</h2><ul class="list">${r.reminders.map(x =>
      `<li><div class="main">${esc(x.kind)}<div class="sub">${[x.kmLeft != null ? (x.kmLeft >= 0 ? `faltam ${km(x.kmLeft)} km` : `passou ${km(-x.kmLeft)} km`) : '', x.daysLeft != null ? (x.daysLeft >= 0 ? `em ${x.daysLeft} dias` : `há ${-x.daysLeft} dias`) : ''].filter(Boolean).join(' · ')}</div></div></li>`).join('')}</ul></div>` : '';
    $('#summary').hidden = false;
    $('#note').textContent = e.stale ? 'Offline: dados salvos neste aparelho.' : '';
  } catch (err) {
    $('#note').textContent = err.kind === 'auth' ? 'Token recusado pelo cofre. Reconecte em Carro → Cofre.' : 'Não foi possível carregar o resumo.';
  }
}
const hm = ms => new Date(ms).toTimeString().slice(0, 5);
const mins = m => m < 60 ? `${m}<small> min</small>` : `${Math.floor(m / 60)}<small> h</small> ${m % 60}`;
async function busMain() {
  if (!vault.configured()) return;
  const box = $('#bus');
  try {
    const { items } = await vault.list('bus-setup'), rec = items.find(x => x.id === 'setup');
    const setup = rec && rec.state;
    if (!setup) return;
    const unir = createUnir({ getJSON: fetchJSON, storage: localStorage }), base = stcpBase(location.hostname);
    const rows = await nextBuses(setup, { fetchStcp: id => fetchJSON(base, `/api/stops/${encodeURIComponent(id)}/realtime`), unirUpcoming: l => unir.unirUpcoming(l, 3) });
    if (!rows.length) return;
    box.innerHTML = `<div class="card"><h2>Próximo ônibus</h2><ul class="list">${rows.map(r => {
      if (r.err) return `<li><div class="main">${esc(r.label)}<div class="sub">Sem resposta agora.</div></div></li>`;
      if (r.empty) return `<li><div class="main">${esc(r.label)}<div class="sub">${r.kind === 'unir' ? 'Nenhum horário nos próximos 7 dias.' : 'Sem previsão agora.'}</div></div></li>`;
      if (r.kind === 'stcp') return `<li><div class="main">${esc(r.label)}<div class="sub">${esc(r.stop)} · ao vivo</div></div><div class="nb">${r.minutesList.map(m => mins(m)).join(' · ')}</div></li>`;
      return `<li><div class="main">${esc(r.label)}<div class="sub">linha ${esc(r.line)} às ${hm(r.depAt)} para ${esc(r.to)} · chega ${r.est ? '≈' : ''}${hm(r.doneAt)} · horário</div></div><div class="nb">${mins(r.minutes)}</div></li>`;
    }).join('')}</ul><p class="tag" style="margin:8px 0 0">Detalhes em <a href="onibus.html">Ônibus</a>.</p></div>`;
  } catch (err) { /* a home continua sem o card de ônibus */ }
}
main();
busMain();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
