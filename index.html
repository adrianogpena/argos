<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argos</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101316">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preload" href="lib/fonts/saira-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="lib/fonts/hanken-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="lib/argos.css">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('argos.theme') || 'dark'; } catch (e) {}</script>
<style>
/* Específico da Início */
.head { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
.head h1 { font-family: var(--font-num); font-size: 28px; letter-spacing: .5px; text-transform: uppercase; }
.head .when { margin-right: auto; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.note { margin: 0; }
.note.bad { color: var(--danger); }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.g3[data-n="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3[data-n="1"] { grid-template-columns: minmax(0, 1fr); }
.g2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.g2[data-n="1"] { grid-template-columns: minmax(0, 1fr); }
.gp { text-align: center; }
.gp .lab, .gp .sub { text-align: left; }
.gp .gauge-box { margin-top: 8px; }
.gp .gauge-value { font-size: 36px; }
.gp .cap { margin-top: 8px; }
.big { font-size: 44px; line-height: 1.05; margin: 8px 0 2px; }
.big small { font-size: 20px; }
.row2 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.blist, .rlist { list-style: none; margin: 0; padding: 0; }
.blist li, .rlist li { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--track); }
.blist li:first-child, .rlist li:first-child { border-top: 0; padding-top: 4px; }
.blist .main, .rlist .main { min-width: 0; }
.bn { font-size: 64px; line-height: .9; text-align: right; white-space: nowrap; }
.bn small { font-size: 24px; }
.bl { font-size: 20px; font-weight: 600; }
.chart-sum { margin-top: 8px; }
.axis { display: flex; justify-content: space-between; margin-top: 2px; }
.pill { display: inline-block; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--tab-active); }
.review { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.mods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.mod { display: block; text-decoration: none; color: inherit; }
.mod h2 { font-size: 18px; margin: 0 0 4px; }
.mod p { margin: 0; }
button.mod { width: 100%; text-align: left; border: 0; cursor: pointer; }
.mod:hover { background: var(--tab-active); }
.seclabel { margin: 8px 0 0; }
.cofre { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input { min-height: 44px; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--track); }
.field input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.msg.bad { color: var(--danger); }
.cofre .btn { align-self: flex-start; }
.link-btn { align-self: flex-start; }
[hidden] { display: none !important; }
@media (max-width: 700px) {
  .head h1 { font-size: 26px; }
  .stack, .g3, .g2, .mods { gap: 12px; }
  .g3, .g3[data-n="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 > .panel:nth-child(odd):last-child { grid-column: 1 / -1; }
  .g3[data-n="1"] { grid-template-columns: minmax(0, 1fr); }
  .g2, .mods { grid-template-columns: minmax(0, 1fr); }
  .gp { padding: 14px 10px; }
  .gp .lab, .gp .sub { padding-left: 6px; }
  .gp .gauge-value { font-size: 28px; }
  .bn { font-size: 52px; }
  .bl { font-size: 18px; }
}
</style>
</head>
<body>
<nav class="nav" data-nav aria-label="Principal"></nav>
<main class="wrap">
  <div class="head"><h1>Início</h1><span class="mu when" id="when"></span><button class="theme-btn" data-theme-btn type="button"></button></div>
  <div class="stack">
    <p id="note" class="mu note" role="status"></p>
    <div id="bus"></div>
    <div id="summary" class="stack" hidden></div>

    <h2 class="lab seclabel">Módulos</h2>
    <div class="mods">
      <a class="panel mod" href="onibus.html"><h2>Ônibus</h2><p class="mu">Chegadas STCP e horários UNIR</p></a>
      <a class="panel mod" href="carro.html"><h2>Carro</h2><p class="mu">Km, abastecimento, consumo e revisões</p></a>
      <a class="panel mod" href="gastos.html"><h2>Gastos</h2><p class="mu">Resumo mensal, por categoria e faturas</p></a>
      <a class="panel mod" href="cartao.html"><h2>Cartão</h2><p class="mu">Parcelas futuras e prazo para quitar</p></a>
      <a class="panel mod" href="saude.html"><h2>Saúde</h2><p class="mu">Peso e altura de pessoas e bichos</p></a>
      <button class="panel mod" id="btnCofre" type="button" aria-expanded="false" aria-controls="cofre"><h2>Cofre</h2><p class="mu">Endereço e token deste aparelho</p></button>
    </div>
    <section id="cofre" class="panel cofre" hidden aria-label="Cofre">
      <label class="field"><span class="lab">Endereço do cofre</span><input id="cfgUrl" type="url" placeholder="https://vault.seunome.workers.dev" autocomplete="off"></label>
      <label class="field"><span class="lab">Token</span><input id="cfgToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="deixe vazio para manter o atual"></label>
      <div class="msg mu" id="cfgMsg" role="status"></div>
      <button class="btn" id="btnConnect" type="button">Conectar</button>
    </section>
  </div>
</main>
<script type="module">
import { initTheme } from "./lib/theme.js"; initTheme();
import { initNav } from "./lib/nav.js"; initNav();
import { createVault } from './lib/vault.js';
import { homeSummary } from './lib/home-core.js';
import { summary as carSummary } from './lib/car-core.js';
import { gaugeDash, daysShown, dailyTotals, chartPoints, lastTank, pendingReview } from './lib/home-view.js';
import { monthTotal } from './lib/expenses-core.js';
import { nextBuses } from './lib/home-bus.js';
import { createUnir, fetchJSON, stcpBase } from './lib/bus-net.js';

const $ = (s) => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => (n ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'EUR' });
const eur0 = n => (n ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const km = n => Math.round(n).toLocaleString('pt-BR');
const dec1 = n => n.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const vault = createVault();
$('#when').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });

const gauge = (frac, label, value, cyan) =>
  `<div class="gauge-box"><svg class="gauge${cyan ? ' cyan' : ''}" viewBox="0 0 160 96" role="img" aria-label="${esc(label)}"><path class="gauge-track" d="M10 84 A70 70 0 0 1 150 84"/><path class="gauge-fill" d="M10 84 A70 70 0 0 1 150 84" style="stroke-dasharray:${gaugeDash(frac)}"/></svg><div class="gauge-value ins" aria-hidden="true">${esc(value)}</div></div>`;

function fail(msg) { const n = $('#note'); n.className = 'note bad'; n.textContent = msg; }

async function main() {
  if (!vault.configured()) { $('#note').innerHTML = 'Para ver o resumo, conecte o cofre em <b>Cofre</b>, no final desta página.'; return; }
  try {
    const [e, f, s, st] = await Promise.all([vault.list('expenses'), vault.list('car-fuel'), vault.list('car-service'), vault.list('car-status')]);
    const t = today(), data = { expenses: e.items, fuels: f.items, services: s.items, statuses: st.items }, r = homeSummary(data, t);
    // Mês corrente sem extrato mostraria € 0,00: usa o último mês com extrato (banco ou cartão).
    const dm = e.items.reduce((m, x) => (x.source === 'bank' || x.source === 'card') && x.date.slice(0, 7) > m ? x.date.slice(0, 7) : m, '');
    let ref = t;
    if (dm && r.total === 0 && dm < t.slice(0, 7)) { const q = homeSummary(data, dm + '-15'); r.month = q.month; r.total = q.total; r.delta = q.delta; ref = dm + '-15'; }
    const d = r.delta, mname = MONTHS[+r.month.slice(5) - 1];
    // mês anterior = referência do mostrador
    const [yy, mm] = r.month.split('-').map(Number), pd = new Date(yy, mm - 2, 1), prev = pd.getFullYear() + '-' + String(pd.getMonth() + 1).padStart(2, '0');
    const prevTotal = monthTotal(e.items, prev), frac = prevTotal ? r.total / prevTotal : 0;
    const gLabel = prevTotal ? `${Math.round(frac * 100)}% do gasto do mês anterior` : 'sem mês anterior para comparar';
    const deltaTxt = d == null ? 'sem mês anterior para comparar' : (d > 0 ? '▲ ' : d < 0 ? '▼ ' : '') + Math.abs(Math.round(d * 100)) + '% contra o mês anterior';
    const panels = [];
    panels.push(`<div class="panel gp"><h2 class="lab sub">Gasto em ${esc(mname)}</h2>${gauge(frac, gLabel, eur0(r.total))}<div class="mu cap">${prevTotal ? `de ${esc(eur0(prevTotal))} no mês anterior` : 'sem mês anterior'}</div><div class="mu">${esc(deltaTxt)}</div></div>`);
    const tank = lastTank(f.items, st.items);
    if (tank) panels.push(`<div class="panel gp"><h2 class="lab sub">Tanque</h2>${gauge(tank.level / 100, `Tanque ${Math.round(tank.level)}%`, Math.round(tank.level) + '%', true)}<div class="mu cap">${esc(km(tank.liters))} L${tank.range != null ? ` · autonomia ${esc(km(tank.range))} km` : ''}</div></div>`);
    const cs = carSummary(f.items, s.items, st.items);
    if (cs.lastOdo > 0) panels.push(`<div class="panel"><h2 class="lab">Carro</h2><div class="ins big">${esc(km(cs.lastOdo))}<small> km</small></div><div class="mu">${cs.avgLPer100 != null ? `Consumo médio ${esc(dec1(cs.avgLPer100))} L/100 km` : 'Consumo ainda sem abastecimentos completos'}</div></div>`);
    let html = `<div class="g3" data-n="${panels.length}">${panels.join('')}</div>`;

    const days = daysShown(r.month, ref), vals = dailyTotals(e.items, r.month, days), c = chartPoints(vals);
    const sumDays = vals.reduce((a, b) => a + b, 0);
    const chart = c.max > 0
      ? `<svg class="linechart" viewBox="0 0 400 100" role="img" aria-label="${esc(`Gasto por dia em ${mname}: média ${eur0(sumDays / days)} por dia, maior dia ${c.maxDay} com ${eur0(c.max)}`)}"><line class="lc-grid" x1="0" y1="${c.base}" x2="400" y2="${c.base}"/><polygon class="lc-area" points="${c.area}"/><polyline class="lc-line" points="${c.line}"/><circle class="lc-dot" cx="${c.last[0]}" cy="${c.last[1]}" r="4"/></svg><div class="mu axis"><span>dia 1</span><span>dia ${days}</span></div><div class="mu chart-sum">Média ${esc(eur0(sumDays / days))} por dia · maior dia ${c.maxDay} (${esc(eur0(c.max))})</div>`
      : '<div class="mu">Sem gastos neste mês.</div>';
    const side = [];
    const pend = pendingReview(e.items);
    if (pend) side.push(`<div class="panel review"><span><span class="am ins">${pend}</span> ${pend === 1 ? 'gasto para revisar' : 'gastos para revisar'}</span><a class="btn" href="gastos.html">Revisar</a></div>`);
    if (r.reminders.length) side.push(`<div class="panel"><h2 class="lab"><span class="am" aria-hidden="true">●</span> Lembretes do carro</h2><ul class="rlist">${r.reminders.map(x =>
      `<li><div class="main">${esc(x.kind)}<div class="mu">${[x.kmLeft != null ? (x.kmLeft >= 0 ? `faltam ${km(x.kmLeft)} km` : `passou ${km(-x.kmLeft)} km`) : '', x.daysLeft != null ? (x.daysLeft >= 0 ? `em ${x.daysLeft} dias` : `há ${-x.daysLeft} dias`) : ''].filter(Boolean).join(' · ')}</div></div><span class="pill ${x.state === 'overdue' ? 'am' : 'mu'}">${x.state === 'overdue' ? 'vencido' : 'em breve'}</span></li>`).join('')}</ul></div>`);
    html += `<div class="g2" data-n="${side.length ? 2 : 1}"><div class="panel"><div class="row2"><h2 class="lab">Gastos por dia</h2><span class="mu">${esc(mname)}</span></div>${chart}</div>${side.length ? `<div class="stack">${side.join('')}</div>` : ''}</div>`;
    $('#summary').innerHTML = html;
    $('#summary').hidden = false;
    $('#note').textContent = e.stale ? 'Offline: dados salvos neste aparelho.' : '';
  } catch (err) {
    fail(err.kind === 'auth' ? 'Token recusado pelo cofre. Reconecte em Início → Cofre.' : 'Não foi possível carregar o resumo.');
  }
}
const hm = ms => new Date(ms).toTimeString().slice(0, 5);
const mins = m => m < 60 ? `${m}<small> min</small>` : `${Math.floor(m / 60)}<small> h</small> ${m % 60}`;
const minsText = m => m < 60 ? `${m}` : `${Math.floor(m / 60)} h ${m % 60}`;
async function busMain() {
  if (!vault.configured()) return;
  const box = $('#bus');
  try {
    const { items } = await vault.list('bus-setup'), rec = items.find(x => x.id === 'setup');
    const setup = rec && rec.state;
    if (!setup) return;
    const unir = createUnir({ getJSON: fetchJSON, storage: localStorage }), base = stcpBase(location.hostname);
    const rows = await nextBuses(setup, { fetchStcp: id => fetchJSON(base, `/api/stops/${encodeURIComponent(id)}/realtime`), unirUpcoming: l => unir.unirUpcoming(l, 3) });
    if (!rows.length) return;
    box.innerHTML = `<div class="panel"><h2 class="lab"><span class="am" aria-hidden="true">●</span> Próximo ônibus</h2><ul class="blist">${rows.map(r => {
      if (r.err) return `<li><div class="main"><div class="bl">${esc(r.label)}</div><div class="mu">Sem resposta agora.</div></div></li>`;
      if (r.empty) return `<li><div class="main"><div class="bl">${esc(r.label)}</div><div class="mu">${r.kind === 'unir' ? 'Nenhum horário nos próximos 7 dias.' : 'Sem previsão agora.'}</div></div></li>`;
      if (r.kind === 'stcp') { const [a, ...rest] = r.minutesList; return `<li><div class="main"><div class="bl">${esc(r.label)}</div><div class="mu">${esc(r.stop)} · ao vivo${rest.length ? ` · depois ${rest.map(minsText).join(' · ')} min` : ''}</div></div><div class="bn ins am">${mins(a)}</div></li>`; }
      return `<li><div class="main"><div class="bl">${esc(r.label)}</div><div class="mu">linha ${esc(r.line)} às ${hm(r.depAt)} para ${esc(r.to)} · chega ${r.est ? '≈' : ''}${hm(r.doneAt)} · horário</div></div><div class="bn ins am">${mins(r.minutes)}</div></li>`;
    }).join('')}</ul><a class="btn ghost link-btn" href="onibus.html">Detalhes em Ônibus</a></div>`;
  } catch (err) { /* a home continua sem o card de ônibus */ }
}
$("#btnCofre").onclick = () => {
  const box = $("#cofre"), open = box.hidden;
  box.hidden = !open; $("#btnCofre").setAttribute("aria-expanded", String(open));
  if (open) { $("#cfgUrl").value = vault.config().url; $("#cfgToken").value = ""; $("#cfgMsg").textContent = ""; box.scrollIntoView({ block: "nearest" }); }
};
$("#btnConnect").onclick = async () => {
  const url = $("#cfgUrl").value.trim(), tok = $("#cfgToken").value.trim() || vault.config().token, msg = $("#cfgMsg");
  if (!/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:\/])/.test(url) || !tok) { msg.className = "msg bad"; msg.textContent = "Informe o endereço (https://…) e o token."; return; }
  vault.configure(url, tok); msg.className = "msg mu"; msg.textContent = "Testando…";
  try { await vault.ping(); location.reload(); }
  catch (e) { msg.className = "msg bad"; msg.textContent = e.kind === "auth" ? "Token incorreto." : e.kind === "network" ? "Não consegui falar com o cofre. Confira o endereço e a internet." : e.message; }
};
main();
busMain();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
